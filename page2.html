<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Позиционирование элементов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class="header-links">
            <a href="index.html">Основная страница</a>
            <a href="page2.html">Позиционирование элементов</a>
            <a href="table.html">Таблица</a>
        </div>
    </div>

    <h1>Горизонтальное позиционирование</h1>
    <div class="container">
        <div class="block"></div>
        <img src="https://avatars.mds.yandex.net/i?id=8c0ba429eec2f316ef9c7919f244715a_l-7758910-images-thumbs&n=13" alt="Пример изображения">
    </div>

    <h1>Вертикальное позиционирование</h1>
    <div class="container-2">
        <div class="block-2"></div>
    </div>

    <h1>Работа с flex</h1>
    <div class="container-3">
        <div class="block-3">1</div>
        <div class="block-3">2</div>
        <div class="block-3">3</div>
        <div class="block-3">4</div>
        <div class="block-3">5</div>
        <div class="block-3">6</div>
        <div class="block-3">7</div>
        <div class="block-3">8</div>
        <div class="block-3">9</div>
        <div class="block-3">10</div>
    </div>

    <h1>Работа со свойством position</h1>
    <div class="position-container">
        <div class="static-box">Static</div>
        <div class="relative-box">Relative</div>
        <div class="absolute-box">Absolute</div>
    </div>

    <div class="fixed-cat">
        <img src="https://avatars.mds.yandex.net/i?id=d62ac7a06189109f9c6e7b021ad074a5_l-9233495-images-thumbs&n=13" alt="Котик">
    </div>
</body>
</html>
